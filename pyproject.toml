[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodetool-huggingface"
version = "0.7.9"
description = "HuggingFace nodes for Nodetool"
readme = "README.md"
authors = [{ name = "Matthias Georgi", email = "matti.georgi@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "nodetool-core>=0.7.1",
    "torch==2.9.0",
    "torchsde",
    "torchvision==0.24.0",
    "torchaudio==2.9.0",
    "hf_xet",
    "kokoro>=0.9.4",
    # MiniMax-H3 is not included in Diffusers 0.39.0 yet. Keep released package
    # dependencies publishable; use requirements/hf-latest.txt for local
    # MiniMax-H3 testing until the integration reaches a Diffusers release.
    "diffusers[torch]>=0.39.0,<1",
    "llama-index-embeddings-huggingface>=0.6.1",
    "transformers>=5.15.0,<6",
    "mistral-common[image]>=1.10.0,<2",
    "huggingface_hub>=1.11.0,<2",
    "accelerate>=1.13.0,<2",
    "safetensors>=0.7.0,<1",
    "tokenizers>=0.22.2,<1",
    "peft>=0.19.1,<1",
    "sentencepiece",
    # PyAV: muxing generated video with its generated soundtrack, and decoding
    # MiniMax-H3 reference media at the rates the container reports.
    "av",
    "pydub>=0.25.1",
    "sam2",
    "accelerate",
    "qwen-vl-utils",
    "bitsandbytes",
    "timm",
    "trimesh>=4.0.0",
    "jaxtyping",
    "typeguard",
    # Audio analysis: speaker diarization and source separation.  pyannote
    # checkpoints are gated on the Hub (accept conditions + HF_TOKEN required).
    #
    # 4.0 is required, not preferred: pyannote.audio 3.x does
    # `from torchaudio import AudioMetaData` at import time and torchaudio 2.9
    # removed the symbol, so `import pyannote.audio` raises AttributeError.
    # 4.0 switched audio I/O to torchcodec and dropped the reference. The floor
    # is 4.0.4 because 4.0.2 and 4.0.3 pin `torch==2.8.0` and
    # `torchaudio==2.8.0`, which contradict this package's torch 2.9.
    "pyannote.audio>=4.0.4,<5",
    # pyannote.audio 4 decodes audio through torchcodec. Pin it to the build
    # that matches torch 2.9 -- torchcodec links against libtorch, and pip
    # would otherwise resolve a wheel built for a newer torch.
    "torchcodec==0.9.1",
    "speechbrain>=1.0,<2",
    # transformers' document-question-answering pipeline runs Tesseract OCR
    # itself whenever it is handed an image without word_boxes, which is the
    # default path for DocumentQuestionAnswering.  A base dependency, not an
    # extra: the node ships in every install, so its OCR binding must too.
    # (The tesseract binary is a system package the deployment installs.)
    "pytesseract>=0.3.13",
    # diffusers' Wan image-to-video pipeline cleans every prompt with
    # ftfy.fix_text and, unlike its text-to-video sibling, does not guard that
    # call — so Wan_I2V and Wan_FLF2V raise NameError on their first prompt
    # without it.  A base dependency, not an extra: both nodes ship in every
    # install, and the Dockerfile installs this package with no extras.
    "ftfy>=6.1",
    # transformers decodes an audio *path* through transformers.audio_utils
    # .load_audio, whose "auto" backend picks torchcodec>=0.3.0 when it is
    # installed and falls back to librosa otherwise.  AudioFlamingo is the one
    # node here that hands transformers a path rather than a numpy array (the
    # rest decode with context.audio_to_numpy, and load_audio returns an
    # ndarray untouched), so on a pod with neither backend it failed with
    # "load_audio requires the librosa library".  librosa is also the only
    # backend the parakeet / nemotron_asr_streaming / cohere_asr feature
    # extractors accept -- they build their mel filters with
    # librosa.filters.mel, which torchcodec does not replace.  A base
    # dependency, not an extra: the node ships in every install, and the
    # Dockerfile installs this package with no extras.  The floor matches
    # nodetool-lib-audio's so the two resolve together.
    "librosa>=0.10.2",
    # -- 3D and speech node dependencies -------------------------------------
    # These were extras nobody installed, so four nodes failed out of the box on
    # an import rather than doing their job.  Every one below has wheels for
    # macOS, manylinux and Windows on Python 3.11-3.13; nothing here compiles at
    # install time.
    #
    # scikit-image: TripoSG._prepare_image (skimage.measure.label,
    #   skimage.morphology.remove_small_objects).
    # pymeshlab:    TripoSG._prepare_mesh, and Hunyuan3D.
    # hy3dgen:      Hunyuan3D.  Pulls opencv-python, rembg, onnxruntime and
    #   gradio in itself, which is where those arrive from.
    # supertonic:   SupertonicTTS.  Pure python over onnxruntime.
    "scikit-image",
    "pymeshlab",
    "hy3dgen>=2.0.2",
    "supertonic>=1.3.1,<2",
    # NOT here, deliberately:
    # f5-tts -- weighed and declined.  It resolves cleanly, but 41 of the 74
    #   packages a plain install would gain come from its subtree alone
    #   (wandb, datasets, boto3, google-auth, sentry-sdk, pyarrow), and it
    #   drags rich from 15.0.0 down to 13.9.4 through cached-path.  Four
    #   packages buy three working nodes; the fifth costs more than the other
    #   four together.  F5TTS stays behind `pip install
    #   nodetool-huggingface[f5-tts]`.
    # opencv-python -- `cv2` already resolves on a plain install through
    #   opencv-python-headless, which mistral-common[image] brings in.  Every
    #   cv2 call in this package is core imgproc (threshold, findContours,
    #   contourArea, INTER_AREA), none of it GUI, so headless serves them all.
    #   Declaring opencv-python would add a second provider of the same `cv2`
    #   module, which upstream tells you not to do.
    # rembg -- only StableFast3D imports it, and that node needs the git-only
    #   sf3d package, so it cannot run on a PyPI install regardless.  TripoSG
    #   does its own background removal with the vendored BriaRMBG.
    # diso -- sdist-only, compiles against a CUDA toolchain at install time.
    #   TripoSG already guards it as the optional flash decoder and falls back
    #   to marching cubes, so it stays in the triposg extra.
]

[project.optional-dependencies]
ocr = [
    "paddleocr",
    "paddlepaddle",
]

kokoro-ja = [
    "misaki[ja]",
    "pyopenjtalk",
]
# Kept as empty aliases, not deleted: their contents are base dependencies now,
# and `pip install nodetool-huggingface[supertonic]` still appears in scripts,
# Dockerfiles and this package's own node docstrings.  An empty extra installs
# the base package and succeeds; a removed one is an error.  `shape` below has
# been an empty alias for the same reason.
supertonic = []
hunyuan3d = []
# NOT an alias: f5-tts was weighed for promotion and declined, so this extra
# still has to install something.  torchcodec is not repeated here -- it is a
# base dependency already (pyannote.audio 4 decodes through it), and a second
# `==` pin would be one more place to update and a conflict waiting to happen.
f5-tts = [
    "f5-tts>=1.1.22,<2",
]
# Still meaningful: diso is the optional flash decoder TripoSG falls back from,
# and neither it nor rembg is a base dependency.
triposg = [
    "diso ; platform_system != 'Darwin'",
    "rembg ; platform_system != 'Darwin'",
]

# Git-only stacks — the upstream packages (sf3d, tsr, o_voxel) are NOT on
# PyPI.  Install them from the pinned requirement files in requirements/
# (e.g. `pip install -r requirements/sf3d.txt`).  The extras here list only
# the PyPI-available companion deps so `pip install nodetool-huggingface[sf3d]`
# still pulls in what it can.  See D5 in FIX-MODEL3D.md.
sf3d = ["rembg"]
triposr = ["rembg"]
# TRELLIS.2 (trellis2, o_voxel) has no PyPI-available companion dependency —
# both packages themselves are git-only (requirements/trellis2.txt) and o_voxel
# builds CUDA C++ extensions at install time, which PyPI extras cannot express.
# There is deliberately no `trellis2` extra: the node's own INSTALL_HINT points
# at `pip install -r requirements/trellis2.txt`, never at this extras group.

# Always installable — Shap-E only needs diffusers (already in core deps)
shape = []

# Convenience meta-groups (PyPI-installable extras only)
all-3d-pypi = ["nodetool-huggingface[hunyuan3d,triposg]"]
all-3d = ["nodetool-huggingface[hunyuan3d,triposg,sf3d,triposr]"]

[tool.hatch.build.targets.wheel]
packages = ["src/nodetool", "src/RealESRGAN", "src/triposg"]
include = [
    "src/nodetool/package_metadata/*.json",
    "src/nodetool/assets/**/*.jpg",
    "src/nodetool/assets/**/*.png",
    "src/nodetool/integrations/huggingface/*.json",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
nodetool = [
    "package_metadata/nodetool-huggingface.json",
    "integrations/huggingface/*.json",
    "assets/nodetool-huggingface/Image to Image.jpg",
    "assets/nodetool-huggingface/Stable Diffusion.jpg",
    "assets/nodetool-huggingface/Image Enhance.jpg",
    "assets/nodetool-huggingface/Segmentation.jpg",
    "assets/nodetool-huggingface/Pokemon Maker.jpg",
    "assets/nodetool-huggingface/stable_diffusion_xl.jpg",
    "assets/nodetool-huggingface/Audio To Image.jpg",
    "assets/nodetool-huggingface/Re-Imagine.jpg",
    "assets/nodetool-huggingface/Audio To Spectrogram.jpg",
    "assets/nodetool-huggingface/Object Detection.jpg",
    "assets/nodetool-huggingface/Add Subtitles To Video.jpg",
    "assets/nodetool-huggingface/Upscaling.jpg",
    "assets/nodetool-huggingface/Depth Estimation.jpg",
    "assets/nodetool-huggingface/Movie Posters.jpg",
    "assets/nodetool-huggingface/Piano Track.jpg",
    "assets/nodetool-huggingface/Controlnet.jpg",
    "assets/nodetool-huggingface/Summarize Audio.jpg",
    "assets/nodetool-huggingface/Transcribe Audio.jpg",
    "assets/nodetool-huggingface/Style Transfer.jpg",
]

[tool.uv.extra-build-dependencies]
# diso imports torch from setup.py but does not declare its build requirements.
diso = ["setuptools", "torch"]

[tool.ruff]
# Exclude auto-generated files and notebooks.
# NOTE: vendored third-party trees (src/triposg/, src/RealESRGAN/), scripts/ and
# test_qwen.py are no longer fully excluded — they are linted for F821 (undefined
# name) only, via the per-file-ignores block below. Fully excluding them let a real
# NameError bug ship in vendored code.
exclude = [
    "notebooks/",
]

[tool.ruff.lint.per-file-ignores]
# Every pycodestyle/Pyflakes code except F821, so undefined names are caught
# everywhere without producing a wall of unrelated style violations.
"scripts/**" = ["E", "W", "F4", "F5", "F6", "F7", "F81", "F822", "F823", "F84", "F9"]
"src/RealESRGAN/**" = ["E", "W", "F4", "F5", "F6", "F7", "F81", "F822", "F823", "F84", "F9"]
"src/triposg/**" = ["E", "W", "F4", "F5", "F6", "F7", "F81", "F822", "F823", "F84", "F9"]
"test_qwen.py" = ["E", "W", "F4", "F5", "F6", "F7", "F81", "F822", "F823", "F84", "F9"]

[tool.ruff.lint]
# Enable a minimal set of rules initially
select = ["E", "F", "W"]
# Ignore specific rules that have many violations
ignore = [
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
    "E721",  # Use `is` and `is not` for type comparisons
    "E722",  # Do not use bare `except`
    "F401",  # Module imported but unused
    "F811",  # Redefinition of unused name
    "F841",  # Local variable assigned but never used
]

# Basedpyright configuration for type checking
[tool.basedpyright]
typeCheckingMode = "standard"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeStubs = "none"
reportUnusedImport = "none"
reportUnusedVariable = "none"
reportUnusedFunction = "none"
reportUnusedClass = "none"
