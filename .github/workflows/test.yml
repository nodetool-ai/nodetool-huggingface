name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      # Fails when pyproject.toml changed without re-locking, so CI and
      # `uv sync` users test the dependency set the lock records.
      - name: Check the lock file
        run: uv lock --check

      - name: Install dependencies from the lock file
        run: uv sync --locked

      - name: Ruff
        run: uv run --locked ruff check .

      - name: Pytest
        run: uv run --locked pytest -q

      - name: Check package metadata is up to date
        run: |
          uv run --locked nodetool-pkg scan --write
          git diff --exit-code -- src/nodetool/package_metadata/
